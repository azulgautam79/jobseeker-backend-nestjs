apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          datasourceUid: tempo
          url: '$${__value.raw}'

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200

    jsonData:
      httpMethod: GET

      tracesToLogsV2:
        datasourceUid: loki

        filterByTraceID: false
        filterBySpanID: false

        customQuery: true

        query: '{service="$${__span.tags["service.name"]}"} | json | trace_id="$${__trace.traceId}"'

        tags:
          - key: service.name
            value: service

      serviceMap:
        datasourceUid: prometheus

      nodeGraph:
        enabled: true

      search:
        hide: false